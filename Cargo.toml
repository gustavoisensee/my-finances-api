[package]
name = "my-finances-api"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false
default-run = "local"

[lib]
name = "my_finances_api"
path = "src/lib.rs"

# Vercel function: every file in api/ must be declared as a [[bin]].
[[bin]]
name = "main"
path = "api/main.rs"

[[bin]]
name = "local"
path = "src/bin/local.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[[bin]]
name = "clean"
path = "src/bin/clean.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dotenvy = "0.15"
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "chrono",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
vercel_runtime = { version = "2.4", features = ["axum"] }

[dev-dependencies]
base64 = "0.22"
http-body-util = "0.1"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

# RSA key generation in tests is very slow without optimisations.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
